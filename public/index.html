<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus Challan Checker</title>
    <style>
      :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --danger:#f87171; --warn:#fbbf24; --ok:#34d399; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
      header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
      h1 { font-size:20px; margin:0; }
      .wrap { max-width:1100px; margin:0 auto; padding:24px; }
      .row { display:flex; gap:16px; flex-wrap:wrap; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; flex:1; min-width:180px; }
      .card .label { color:var(--muted); font-size:13px; }
      .card .value { font-size:28px; font-weight:700; margin-top:6px; }
      .accent { color:var(--accent); } .warn { color:var(--warn); } .ok { color:var(--ok); }
      section { margin-top:28px; }
      h2 { font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
      table { width:100%; border-collapse:collapse; font-size:14px; }
      th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
      th { color:var(--muted); font-weight:600; }
      input, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#0b1220; color:var(--text); }
      button { background:var(--accent); color:#04232f; border:none; font-weight:600; cursor:pointer; }
      button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
      button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
      .pill { padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
      .muted { color:var(--muted); font-size:13px; }
      .keybar { display:flex; gap:8px; align-items:center; }
    </style>
  </head>
  <body>
    <header>
      <h1>🚌 Bus Challan Checker</h1>
      <div class="keybar">
        <input id="apiKey" type="password" placeholder="API key (if set)" />
        <button id="refreshBtn">Refresh now</button>
      </div>
    </header>

    <div class="wrap">
      <div class="row" id="summary"></div>

      <section>
        <h2>This Month by Bus</h2>
        <table id="fleetTable">
          <thead>
            <tr><th>Bus</th><th>Name</th><th>Total challans</th><th>Total amount</th><th>Pending</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="row" style="margin-top:12px">
          <input id="newNumber" placeholder="Bus number e.g. RJ14PA1234" />
          <input id="newName" placeholder="Label (optional)" />
          <button id="addBtn">Add bus</button>
        </div>
      </section>

      <section>
        <h2>Monthly Totals (whole fleet)</h2>
        <table id="monthlyTable">
          <thead>
            <tr><th>Month</th><th>Challans</th><th>Amount</th><th>Pending</th><th>Paid</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <p class="muted" id="lastRefresh"></p>
    </div>

    <script>
      const rupee = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
      const keyInput = document.getElementById('apiKey');
      keyInput.value = localStorage.getItem('challanApiKey') || '';
      keyInput.addEventListener('change', () => localStorage.setItem('challanApiKey', keyInput.value));

      async function api(path, opts = {}) {
        const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers);
        if (keyInput.value) headers['x-api-key'] = keyInput.value;
        const res = await fetch('/api' + path, Object.assign({}, opts, { headers }));
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
        return res.json();
      }

      function card(label, value, cls = '') {
        return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`;
      }

      async function load() {
        try {
          const s = await api('/reports/summary');
          document.getElementById('summary').innerHTML = [
            card('Buses tracked', s.buses, 'accent'),
            card('Challans this month', s.thisMonth.count, 'warn'),
            card('Amount this month', rupee(s.thisMonth.amount), 'warn'),
            card('Pending (all time)', rupee(s.allTime.pendingAmount), 'danger'),
          ].join('');
          document.getElementById('lastRefresh').textContent =
            s.lastRefresh ? 'Last auto-refresh: ' + new Date(s.lastRefresh).toLocaleString() : 'Not refreshed yet';

          const fleet = (await api('/reports/fleet')).buses;
          document.querySelector('#fleetTable tbody').innerHTML = fleet.length
            ? fleet.map((b) => `<tr>
                <td><strong>${b.number}</strong></td><td>${b.name}</td>
                <td>${b.count}</td><td>${rupee(b.amount)}</td>
                <td><span class="pill">${b.pending} · ${rupee(b.pendingAmount)}</span></td>
                <td><button class="danger" data-del="${b.number}">Remove</button></td>
              </tr>`).join('')
            : '<tr><td colspan="6" class="muted">No buses yet — add one below.</td></tr>';

          const months = (await api('/reports/monthly?months=6')).months.slice().reverse();
          document.querySelector('#monthlyTable tbody').innerHTML = months.map((m) => `<tr>
              <td>${m.month}</td><td>${m.count}</td><td>${rupee(m.amount)}</td>
              <td>${m.pending}</td><td>${m.paid}</td></tr>`).join('');
        } catch (e) {
          alert('Error: ' + e.message);
        }
      }

      document.getElementById('addBtn').addEventListener('click', async () => {
        const number = document.getElementById('newNumber').value.trim();
        if (!number) return;
        try {
          await api('/buses', { method: 'POST', body: JSON.stringify({ number, name: document.getElementById('newName').value.trim() }) });
          document.getElementById('newNumber').value = '';
          document.getElementById('newName').value = '';
          setTimeout(load, 600);
        } catch (e) { alert(e.message); }
      });

      document.getElementById('refreshBtn').addEventListener('click', async () => {
        try { await api('/refresh', { method: 'POST' }); load(); } catch (e) { alert(e.message); }
      });

      document.addEventListener('click', async (e) => {
        const num = e.target.getAttribute('data-del');
        if (!num) return;
        if (!confirm('Remove ' + num + '?')) return;
        await api('/buses/' + encodeURIComponent(num), { method: 'DELETE' });
        load();
      });

      load();
    </script>
  </body>
</html>
